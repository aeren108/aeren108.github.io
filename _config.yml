title: aeren # name of the site
author: A. Eren Çolak # name of site's author
email: raeren108@outlook.com  # email of site's author
url: https://aerenpozitif.com # root address of the site
description: "internetin bana ayrılan bu kısmında, zaman zaman bir şeyler karalıyorum."

permalink: /:slug.html

favicon: "logo.png" # name+extension of favicon (which must be put on the root folder)
# goat_counter: "yoursitename" # put your GoatCounter name if you want to use GoatCounter analytics

#theme: no-style-please # if you are using GitHub Pages, change it to #remote_theme: riggraz/no-style-please

theme_config:
  appearance: "dark" # can be "light", "dark" or "auto"
  back_home_text: "[ ← geri ]" # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: true # show blog description in home page

sass:
  style: :compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
